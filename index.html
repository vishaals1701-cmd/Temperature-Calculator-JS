<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="containerOne">
        <form>

            <h3>Temperature Calculator!!</h3>
            <input type="number" id="userInput" value="0"><br>

            <input type="radio" id="toFahrenheit" name="temperature">
            <label for="toFahrenheit">Celsius ➡️ Fahrenheit</label><br>

            <input type="radio" id="toCelsius" name="temperature">
            <label for="toCelsius">Fahrenheit ➡️ Celsius</label><br>

            <button type="button" id="resultBtn" onclick="toConvert()">To Check</button><br>

            <p id="resultDisplay">Result</p>

        </form>
    </div>
    <script src="index.js"></script>
</body>
</html>
